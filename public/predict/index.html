<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
let allPlayers = [];
let allClubs   = [];
const sel       = {};  // slotKey → { name, rating }
const callbacks = {};  // slotKey → onChange fn
const slotGroup = {};  // slotKey → 'home' | 'away' | 'rubber' | 'rotation'

const clubFilters = {
  home:     '',
  away:     '',
  rubber:   new Set(),
  rotation: new Set(),
};

let currentLeague = new URLSearchParams(window.location.search).get('league') || 'mens';

// ── League Management ────────────────────────────────────────────────────────
function setLeague(league) {
  if (currentLeague === league) return;
  currentLeague = league;
  
  // Update UI
  document.body.classList.toggle('mixed', league === 'mixed');
  document.getElementById('btnMens').classList.toggle('active', league === 'mens');
  document.getElementById('btnMixed').classList.toggle('active', league === 'mixed');
  document.getElementById('mainTitle').innerHTML = `York ${league === 'mixed' ? 'Mixed' : 'Men\'s'} Tennis — <span>Predictor</span>`;
  
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('league', league);
  window.history.pushState({}, '', url);

  // Clear selections
  for (const k in sel) {
    const trigger = document.getElementById(`dd-${k}`)?.previousElementSibling;
    if (trigger) {
      const input = trigger.querySelector('.picker-input');
      const badge = trigger.querySelector('.picker-badge');
      const clearBtn = trigger.querySelector('.picker-clear');
      const dropdown = document.getElementById(`dd-${k}`);
      if (input) clearSel(k, input, badge, clearBtn, trigger, dropdown);
    } else {
      delete sel[k];
    }
  }
  
  clubFilters.home = '';
  clubFilters.away = '';
  clubFilters.rubber.clear();
  clubFilters.rotation.clear();

  // Reset club selects
  document.getElementById('homeClubSelect').value = '';
  document.getElementById('awayClubSelect').value = '';
  document.getElementById('homeTeamName').value = '';
  document.getElementById('awayTeamName').value = '';

  init();
}

// Player colours for rotation
const ROT_COLORS = { rotA: '#a78bfa', rotB: '#f87171', rotC: '#34d399', rotD: '#fbbf24' };
const ROT_LABELS = { rotA: 'Player A', rotB: 'Player B', rotC: 'Player C', rotD: 'Player D' };
const ROT_CSS    = { rotA: 'pa', rotB: 'pb', rotC: 'pc', rotD: 'pd' };

// The 3 pairings in a 4-player rotation
const ROTATIONS = [
  { left: ['rotA','rotB'], right: ['rotC','rotD'] },
  { left: ['rotA','rotC'], right: ['rotB','rotD'] },
  { left: ['rotA','rotD'], right: ['rotB','rotC'] },
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ratingColor(r) {
  if (r >= 2000) return '#f5a623';
  if (r >= 1700) return '#a78bfa';
  if (r >= 1400) return '#3b82f6';
  if (r >= 1100) return '#10b981';
  return '#64748b';
}
function divColor(d) { return ['','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#ec4899','#ec4899'][d] || '#64748b'; }

// ── ELO Math ──────────────────────────────────────────────────────────────────
function winProb(homeAvg, awayAvg) { return 1 / (1 + Math.pow(10, (awayAvg - homeAvg) / 400)); }

function totalGames() { return Math.max(1, parseInt(document.getElementById('gamesInput').value, 10) || 12); }

// Predict score for a rubber played over `games` total games.
// Winner gets round(p * games), loser gets the remainder.
function probToScore(p) {
  const games = totalGames();
  const homeGames = Math.round(p * games);
  return [homeGames, games - homeGames];
}
function cellBg(p) {
  const d = Math.abs(p - 0.5) * 2;
  if (p > 0.5) return `rgba(124,107,221,${(0.06 + d * 0.24).toFixed(2)})`;
  if (p < 0.5) return `rgba(224, 82, 82,${(0.06 + d * 0.22).toFixed(2)})`;
  return 'rgba(148,163,184,0.08)';
}
function pairAvg(k1, k2) { return ((sel[k1]?.rating || 0) + (sel[k2]?.rating || 0)) / 2; }

// ── Player pool ───────────────────────────────────────────────────────────────
function getPool(slotKey, query) {
  const q     = query.toLowerCase().trim();
  const group = slotGroup[slotKey];
  let pool    = allPlayers;
  let filtered = false;
  if      (group === 'home'     && clubFilters.home)              { pool = allPlayers.filter(p => p.club === clubFilters.home);             filtered = true; }
  else if (group === 'away'     && clubFilters.away)              { pool = allPlayers.filter(p => p.club === clubFilters.away);             filtered = true; }
  else if (group === 'rubber'   && clubFilters.rubber.size > 0)   { pool = allPlayers.filter(p => clubFilters.rubber.has(p.club));          filtered = true; }
  else if (group === 'rotation' && clubFilters.rotation.size > 0) { pool = allPlayers.filter(p => clubFilters.rotation.has(p.club));       filtered = true; }
  if (q) return pool.filter(p => p.name.toLowerCase().includes(q)).slice(0, 12);
  // When a club filter is active show all matching players; otherwise cap at 10 as a hint
  return filtered ? pool : pool.slice(0, 10);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  document.body.classList.toggle('mixed', currentLeague === 'mixed');
  document.getElementById('btnMens').classList.toggle('active', currentLeague === 'mens');
  document.getElementById('btnMixed').classList.toggle('active', currentLeague === 'mixed');
  document.getElementById('mainTitle').innerHTML = `York ${currentLeague === 'mixed' ? 'Mixed' : 'Men\'s'} Tennis — <span>Predictor</span>`;

  // Update nav links to preserve league
  document.querySelectorAll('nav a').forEach(a => {
    const url = new URL(a.href, window.location.origin);
    url.searchParams.set('league', currentLeague);
    a.href = url.pathname + url.search;
  });

  const res  = await fetch(`/api/leaderboard?league=${currentLeague}`);
  const data = await res.json();
  allPlayers = data.leaderboard;
  allClubs   = data.clubs;

  populateClubSelects();
  buildClubPills('rubberClubPills',   'rubber');
  buildClubPills('rotationClubPills', 'rotation');
  
  // Clear any existing UI containers before rebuilding
  document.getElementById('homePairsContainer').innerHTML = '';
  document.getElementById('awayPairsContainer').innerHTML = '';
  document.getElementById('rubberAContainer').innerHTML = '';
  document.getElementById('rubberBContainer').innerHTML = '';
  document.getElementById('rotationPlayers').innerHTML = '';

  buildMatchUI();
  buildRubberUI();
  buildRotationUI();

  // Reset output areas
  document.getElementById('scorecardOutput').innerHTML = '';
  document.getElementById('rubberOutput').innerHTML = '';
  document.getElementById('rotationOutput').innerHTML = '';

  document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const t = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    document.getElementById('tabMatch').style.display    = t === 'match'    ? '' : 'none';
    document.getElementById('tabRubber').style.display   = t === 'rubber'   ? '' : 'none';
    document.getElementById('tabRotation').style.display = t === 'rotation' ? '' : 'none';
  });
}

// ── Club selects (full match) ─────────────────────────────────────────────────
function populateClubSelects() {
  ['home', 'away'].forEach(side => {
    const el = document.getElementById(`${side}ClubSelect`);
    el.innerHTML = '<option value="">Select club…</option>'; // Reset
    allClubs.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; el.appendChild(o); });
    el.addEventListener('change', () => {
      clubFilters[side] = el.value;
      const nameEl = document.getElementById(`${side}TeamName`);
      if (el.value && !nameEl.value.trim()) nameEl.value = el.value + ' ';
    });
  });
}

// ── Club pills (multi-select, reusable) ──────────────────────────────────────
function buildClubPills(containerId, filterKey) {
  const container = document.getElementById(containerId);
  container.innerHTML = ''; // Reset
  allClubs.forEach(club => {
    const btn = document.createElement('button');
    btn.className = 'club-pill';
    btn.textContent = club;
    btn.addEventListener('click', () => {
      if (clubFilters[filterKey].has(club)) { clubFilters[filterKey].delete(club); btn.classList.remove('active'); }
      else { clubFilters[filterKey].add(club); btn.classList.add('active'); }
    });
    container.appendChild(btn);
  });
}

// ── Build UIs ─────────────────────────────────────────────────────────────────
function buildMatchUI() {
  for (let p = 1; p <= 3; p++) {
    document.getElementById('homePairsContainer').appendChild(buildPairRow(`h${p}`, p, 'home', onMatchChange));
    document.getElementById('awayPairsContainer').appendChild(buildPairRow(`a${p}`, p, 'away', onMatchChange));
  }
}

function buildRubberUI() {
  ['rA1','rA2'].forEach((k, i) => { slotGroup[k] = 'rubber'; document.getElementById('rubberAContainer').appendChild(wrapPicker(buildPicker(k, `Player ${i+1}`, onRubberChange))); });
  ['rB1','rB2'].forEach((k, i) => { slotGroup[k] = 'rubber'; document.getElementById('rubberBContainer').appendChild(wrapPicker(buildPicker(k, `Player ${i+1}`, onRubberChange))); });
}

function buildRotationUI() {
  const container = document.getElementById('rotationPlayers');
  ['rotA','rotB','rotC','rotD'].forEach(k => {
    slotGroup[k] = 'rotation';
    const card = document.createElement('div');
    card.className = 'rot-player-card';
    card.innerHTML = `<div class="rot-player-header ${ROT_CSS[k]}">${ROT_LABELS[k]}</div><div class="rot-player-body" id="body-${k}"></div>`;
    container.appendChild(card);
    document.getElementById(`body-${k}`).appendChild(buildPicker(k, 'Search player…', onRotationChange));
  });
}

function wrapPicker(picker) { const d = document.createElement('div'); d.style.marginBottom = '8px'; d.appendChild(picker); return d; }

function buildPairRow(prefix, num, group, onChange) {
  const row = document.createElement('div'); row.className = 'pair-row';
  const lbl = document.createElement('div'); lbl.className = 'pair-label'; lbl.textContent = `Pair ${num}`;
  const pp  = document.createElement('div'); pp.className  = 'pair-players';
  [`${prefix}_1`, `${prefix}_2`].forEach((k, i) => { slotGroup[k] = group; pp.appendChild(buildPicker(k, `Player ${i+1}`, onChange)); });
  row.append(lbl, pp); return row;
}

// ── Player Picker ─────────────────────────────────────────────────────────────
function buildPicker(slotKey, placeholder, onChange) {
  callbacks[slotKey] = onChange;
  const wrap = document.createElement('div'); wrap.className = 'player-picker';
  const trigger = document.createElement('div'); trigger.className = 'picker-trigger';
  const input = document.createElement('input'); input.type = 'text'; input.className = 'picker-input'; input.placeholder = placeholder + '…'; input.autocomplete = 'off'; input.spellcheck = false;
  const badge = document.createElement('span'); badge.className = 'picker-badge';
  const clearBtn = document.createElement('span'); clearBtn.className = 'picker-clear'; clearBtn.textContent = '×'; clearBtn.title = 'Clear';
  const dropdown = document.createElement('div'); dropdown.className = 'picker-dropdown'; dropdown.id = `dd-${slotKey}`;
  trigger.append(input, badge, clearBtn); wrap.append(trigger, dropdown);

  input.addEventListener('focus',  () => { if (!sel[slotKey]) showDropdown(slotKey, dropdown, ''); });
  input.addEventListener('click',  () => { if (sel[slotKey]) { clearSel(slotKey, input, badge, clearBtn, trigger, dropdown); showDropdown(slotKey, dropdown, ''); } });
  input.addEventListener('input',  () => { if (sel[slotKey]) clearSel(slotKey, input, badge, clearBtn, trigger, dropdown); showDropdown(slotKey, dropdown, input.value); });
  input.addEventListener('keydown', e => {
    const opts = [...dropdown.querySelectorAll('.picker-option')];
    const fi = opts.findIndex(o => o.classList.contains('focused'));
    if      (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(opts, fi + 1); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); moveFocus(opts, fi - 1); }
    else if (e.key === 'Enter' && opts[fi]) pickPlayer(slotKey, opts[fi].dataset.name, +opts[fi].dataset.rating, input, badge, clearBtn, trigger, dropdown);
    else if (e.key === 'Escape' || e.key === 'Tab') dropdown.classList.remove('open');
  });
  clearBtn.addEventListener('click', e => { e.stopPropagation(); clearSel(slotKey, input, badge, clearBtn, trigger, dropdown); input.focus(); });
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) { dropdown.classList.remove('open'); if (!sel[slotKey]) input.value = ''; } });
  return wrap;
}

function showDropdown(slotKey, dropdown, query) {
  const matches = getPool(slotKey, query);
  if (!matches.length) {
    dropdown.innerHTML = '<div class="picker-empty">No players found</div>';
  } else {
    dropdown.innerHTML = matches.map(p => {
      const col = ratingColor(p.rating);
      const db  = p.current_div ? `<span style="color:${divColor(p.current_div)};font-size:0.68rem;font-weight:700">D${p.current_div}</span>` : '';
      return `<div class="picker-option" data-name="${esc(p.name)}" data-rating="${p.rating}">
        <span class="po-name">${esc(p.name)}</span>
        <span class="po-meta">${db}<span class="po-rating" style="color:${col}">${p.rating.toFixed(0)}</span></span>
      </div>`;
    }).join('');
    dropdown.querySelectorAll('.picker-option').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        const tr = opt.closest('.player-picker').querySelector('.picker-trigger');
        pickPlayer(slotKey, opt.dataset.name, +opt.dataset.rating, tr.querySelector('.picker-input'), tr.querySelector('.picker-badge'), tr.querySelector('.picker-clear'), tr, dropdown);
      });
    });
  }
  dropdown.classList.add('open');
}

function moveFocus(opts, idx) {
  opts.forEach(o => o.classList.remove('focused'));
  const t = opts[Math.max(0, Math.min(idx, opts.length - 1))];
  if (t) { t.classList.add('focused'); t.scrollIntoView({ block: 'nearest' }); }
}

function pickPlayer(slotKey, name, rating, input, badge, clearBtn, trigger, dropdown) {
  sel[slotKey] = { name, rating };
  input.value = name; input.readOnly = true;
  badge.textContent = rating.toFixed(0); badge.style.color = ratingColor(rating); badge.style.display = '';
  clearBtn.style.display = ''; trigger.classList.add('has-value');
  dropdown.classList.remove('open');
  if (callbacks[slotKey]) callbacks[slotKey]();
}

function clearSel(slotKey, input, badge, clearBtn, trigger, dropdown) {
  delete sel[slotKey];
  if (input) { input.value = ''; input.readOnly = false; }
  if (badge) badge.style.display = 'none';
  if (clearBtn) clearBtn.style.display = 'none';
  if (trigger) trigger.classList.remove('has-value');
  if (dropdown) dropdown.classList.remove('open');
  if (callbacks[slotKey]) callbacks[slotKey]();
}

// ── Match readiness ───────────────────────────────────────────────────────────
function onMatchChange() {
  let filled = 0;
  for (let p = 1; p <= 3; p++) { if (sel[`h${p}_1`]) filled++; if (sel[`h${p}_2`]) filled++; if (sel[`a${p}_1`]) filled++; if (sel[`a${p}_2`]) filled++; }
  const btn = document.getElementById('generateBtn'), hint = document.getElementById('generateHint');
  btn.disabled = filled < 12;
  if (filled === 12) { hint.style.color = '#4ade80'; hint.textContent = 'All players selected — ready!'; }
  else { hint.style.color = ''; hint.textContent = `${filled} / 12 players selected`; }
}

function onRubberChange() {
  if (sel.rA1 && sel.rA2 && sel.rB1 && sel.rB2) renderRubberResult();
  else document.getElementById('rubberOutput').innerHTML = '';
}

function onRotationChange() {
  if (sel.rotA && sel.rotB && sel.rotC && sel.rotD) renderRotationResults();
  else document.getElementById('rotationOutput').innerHTML = '';
}

// ── Render: Single Rubber ─────────────────────────────────────────────────────
function renderRubberResult() {
  const homeAvg = (sel.rA1.rating + sel.rA2.rating) / 2;
  const awayAvg = (sel.rB1.rating + sel.rB2.rating) / 2;
  const p = winProb(homeAvg, awayAvg);
  const [hg, ag] = probToScore(p);
  const homeWins = hg > ag, isDraw = hg === ag;
  const homePct = Math.round(p * 100), awayPct = 100 - Math.round(p * 100);
  const verdictColor = homeWins ? '#a78bfa' : isDraw ? 'var(--draw)' : '#f87171';
  const verdictText  = homeWins ? 'Pair A predicted to win' : isDraw ? 'Too close to call — draw predicted' : 'Pair B predicted to win';
  const scoreColor   = homeWins ? '#a78bfa' : isDraw ? 'var(--draw)' : '#f87171';
  const diff = homeAvg - awayAvg;

  document.getElementById('rubberOutput').innerHTML = `
    <div class="rubber-result">
      <div class="prob-section">
        <div class="prob-track"><div class="prob-home" style="width:${homePct}%"></div><div class="prob-away" style="width:${awayPct}%"></div></div>
        <div class="prob-labels"><span style="color:#a78bfa;font-weight:600">${homePct}% Pair A</span><span style="color:#f87171;font-weight:600">Pair B ${awayPct}%</span></div>
      </div>
      <div class="rr-result-main">
        <div class="rr-score" style="color:${scoreColor}">${hg} – ${ag}</div>
        <div class="rr-verdict" style="color:${verdictColor}">${verdictText}</div>
      </div>
      <div class="rr-elo-row">
        <div class="rr-elo-item">
          <div class="rr-elo-lbl">Pair A</div>
          <div class="rr-elo-lbl" style="margin-top:2px">${esc(sel.rA1.name)} / ${esc(sel.rA2.name)}</div>
          <div class="rr-elo-val" style="color:${ratingColor(homeAvg)}">${homeAvg.toFixed(1)}</div>
        </div>
        <div class="rr-elo-item">
          <div class="rr-elo-lbl">Rating diff</div>
          <div class="rr-elo-val" style="color:${diff > 0 ? '#a78bfa' : diff < 0 ? '#f87171' : 'var(--muted)'}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</div>
        </div>
        <div class="rr-elo-item">
          <div class="rr-elo-lbl">Pair B</div>
          <div class="rr-elo-lbl" style="margin-top:2px">${esc(sel.rB1.name)} / ${esc(sel.rB2.name)}</div>
          <div class="rr-elo-val" style="color:${ratingColor(awayAvg)}">${awayAvg.toFixed(1)}</div>
        </div>
      </div>
    </div>`;
}

// ── Render: 4-Player Rotation ─────────────────────────────────────────────────
function renderRotationResults() {
  // Track wins/losses per player key
  const record = { rotA:{w:0,l:0,d:0}, rotB:{w:0,l:0,d:0}, rotC:{w:0,l:0,d:0}, rotD:{w:0,l:0,d:0} };

  const rubberCards = ROTATIONS.map((rot, idx) => {
    const leftAvg  = (sel[rot.left[0]].rating  + sel[rot.left[1]].rating)  / 2;
    const rightAvg = (sel[rot.right[0]].rating + sel[rot.right[1]].rating) / 2;
    const p = winProb(leftAvg, rightAvg);
    const [lg, rg] = probToScore(p);
    const leftWins  = lg > rg, isDraw = lg === rg;
    const pct = leftWins ? Math.round(p * 100) : Math.round((1 - p) * 100);

    // Record results
    const [winners, losers] = leftWins ? [rot.left, rot.right] : isDraw ? [[], []] : [rot.right, rot.left];
    winners.forEach(k => record[k].w++);
    losers.forEach(k => record[k].l++);
    if (isDraw) { [...rot.left, ...rot.right].forEach(k => record[k].d++); }

    const scoreCol  = leftWins ? ROT_COLORS[rot.left[0]]  : isDraw ? 'var(--draw)' : ROT_COLORS[rot.right[0]];
    const winnerLbl = leftWins ? `${ROT_LABELS[rot.left[0]].replace('Player ','')}&${ROT_LABELS[rot.left[1]].replace('Player ','')} win`
                    : isDraw   ? 'Draw'
                    : `${ROT_LABELS[rot.right[0]].replace('Player ','')}&${ROT_LABELS[rot.right[1]].replace('Player ','')} win`;
    const winnerBg  = leftWins ? 'rgba(109,90,205,0.18)' : isDraw ? 'rgba(148,163,184,0.15)' : 'rgba(224,82,82,0.18)';

    const leftNames = rot.left.map(k => `<span style="color:${ROT_COLORS[k]}">${esc(sel[k].name)}</span>`).join('<br>');
    const rightNames = rot.right.map(k => `<span style="color:${ROT_COLORS[k]}">${esc(sel[k].name)}</span>`).join('<br>');
    const leftElo  = leftAvg.toFixed(0);
    const rightElo = rightAvg.toFixed(0);

    const cardBg = leftWins ? 'rgba(124,107,221,0.06)' : isDraw ? 'rgba(148,163,184,0.04)' : 'rgba(224,82,82,0.06)';

    return `
      <div class="rot-rubber-card" style="background:${cardBg}">
        <div class="rot-pair-left">
          <div class="rot-rubber-num">Rubber ${idx + 1}</div>
          <div class="rot-pair-names">${leftNames}</div>
          <div class="rot-pair-elo" style="color:${ratingColor(leftAvg)}">avg ${leftElo}</div>
        </div>
        <div class="rot-score-col">
          <div class="rot-score" style="color:${scoreCol}">${lg} – ${rg}</div>
          <div class="rot-prob">${pct}%</div>
          <span class="rot-winner-tag" style="background:${winnerBg};color:${scoreCol}">${winnerLbl}</span>
        </div>
        <div class="rot-pair-right">
          <div class="rot-rubber-num" style="text-align:right">&nbsp;</div>
          <div class="rot-pair-names" style="text-align:right">${rightNames}</div>
          <div class="rot-pair-elo" style="color:${ratingColor(rightAvg)};text-align:right">avg ${rightElo}</div>
        </div>
      </div>`;
  });

  // Summary table — sort by wins desc
  const players = ['rotA','rotB','rotC','rotD']
    .map(k => ({ k, name: sel[k].name, rating: sel[k].rating, ...record[k] }))
    .sort((a, b) => (b.w - a.w) || (a.l - b.l));

  const tableRows = players.map((p, i) => {
    const col = ROT_COLORS[p.k];
    const total = p.w + p.l + p.d;
    const winPct = total ? Math.round(((p.w + p.d * 0.5) / total) * 100) : 0;
    return `<tr>
      <td><span class="rot-player-dot" style="background:${col}"></span><strong>${esc(p.name)}</strong></td>
      <td style="color:${ratingColor(p.rating)};font-weight:700">${p.rating.toFixed(0)}</td>
      <td style="color:#4ade80;font-weight:700">${p.w}</td>
      <td style="color:#f87171">${p.l}</td>
      <td style="color:var(--draw)">${p.d}</td>
      <td style="color:${winPct >= 50 ? '#4ade80' : 'var(--muted)'};font-weight:600">${winPct}%</td>
    </tr>`;
  }).join('');

  document.getElementById('rotationOutput').innerHTML = `
    <div class="rot-results">
      <div class="rot-rubbers">${rubberCards.join('')}</div>
      <div class="rot-summary">
        <div class="rot-summary-title">Predicted standings</div>
        <table class="rot-table">
          <thead><tr><th>Player</th><th>ELO</th><th>W</th><th>L</th><th>D</th><th>Win %</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Render: Full Match Scorecard ──────────────────────────────────────────────
function generateScorecard() {
  const homeTeam = document.getElementById('homeTeamName').value.trim() || 'Home';
  const awayTeam = document.getElementById('awayTeamName').value.trim() || 'Away';

  const homePairs = [1,2,3].map(p => ({ k1:`h${p}_1`, k2:`h${p}_2`, avg: pairAvg(`h${p}_1`,`h${p}_2`) }));
  const awayPairs = [1,2,3].map(p => ({ k1:`a${p}_1`, k2:`a${p}_2`, avg: pairAvg(`a${p}_1`,`a${p}_2`) }));

  let homeRubbers = 0, awayRubbers = 0;
  const grid = homePairs.map(hp => awayPairs.map(ap => {
    const p = winProb(hp.avg, ap.avg); const [hg, ag] = probToScore(p);
    if (hg > ag) homeRubbers++; else if (ag > hg) awayRubbers++;
    return { p, hg, ag };
  }));

  const colTallies = [0,1,2].map(col => {
    let h = 0, a = 0;
    grid.forEach(row => { if (row[col].hg > row[col].ag) h++; else if (row[col].ag > row[col].hg) a++; });
    return { h, a };
  });

  const homeAvgAll = homePairs.reduce((s,p) => s + p.avg, 0) / 3;
  const awayAvgAll = awayPairs.reduce((s,p) => s + p.avg, 0) / 3;
  const isHomeWin  = homeRubbers > awayRubbers, isAwayWin = awayRubbers > homeRubbers;
  const verdictText  = isHomeWin ? `${esc(homeTeam)} win` : isAwayWin ? `${esc(awayTeam)} win` : 'Match tied';
  const verdictColor = isHomeWin ? '#a78bfa' : isAwayWin ? '#f87171' : 'var(--draw)';

  const awayHeaders = awayPairs.map((ap, i) => `
    <th class="sc-away-hdr">
      <div class="sc-pair-lbl">Away Pair ${i+1}</div>
      <div class="sc-pair-names">${esc(sel[ap.k1].name)}<br>${esc(sel[ap.k2].name)}</div>
      <div class="sc-pair-elo" style="color:${ratingColor(ap.avg)}">${ap.avg.toFixed(0)}</div>
    </th>`).join('');

  const bodyRows = homePairs.map((hp, row) => {
    const cells = grid[row].map(r => {
      const bg = cellBg(r.p); const hw = r.hg > r.ag, dw = r.hg === r.ag;
      const scoreCol  = hw ? '#a78bfa' : dw ? 'var(--draw)' : '#f87171';
      const winnerLbl = hw ? 'Home' : dw ? 'Draw' : 'Away';
      const winnerBg  = hw ? 'rgba(124,107,221,0.2)' : dw ? 'rgba(148,163,184,0.15)' : 'rgba(224,82,82,0.2)';
      const winnerCol = hw ? '#a78bfa' : dw ? 'var(--draw)' : '#f87171';
      const pct = hw ? Math.round(r.p * 100) : Math.round((1 - r.p) * 100);
      return `<td class="sc-cell" style="background:${bg}"><div class="sc-score" style="color:${scoreCol}">${r.hg} – ${r.ag}</div><div class="sc-prob">${pct}%</div><span class="sc-winner" style="background:${winnerBg};color:${winnerCol}">${winnerLbl}</span></td>`;
    }).join('');
    return `<tr><td class="sc-home-hdr"><div class="sc-pair-lbl">Home Pair ${row+1}</div><div class="sc-pair-names">${esc(sel[hp.k1].name)}<br>${esc(sel[hp.k2].name)}</div><div class="sc-pair-elo" style="color:${ratingColor(hp.avg)}">${hp.avg.toFixed(0)}</div></td>${cells}</tr>`;
  }).join('');

  const sumCells = colTallies.map(ct => `<td class="sc-sum-cell"><span class="sc-col-tally" style="color:#a78bfa">${ct.h}H</span><span style="color:var(--muted);font-size:0.7rem;padding:0 4px">/</span><span class="sc-col-tally" style="color:#f87171">${ct.a}A</span></td>`).join('');

  document.getElementById('scorecardOutput').innerHTML = `
    <div class="scorecard-wrap">
      <div class="sc-meta">
        <div class="sc-teams"><span class="home-name">${esc(homeTeam)}</span><span class="sep">vs</span><span class="away-name">${esc(awayTeam)}</span></div>
        <div class="sc-sub">ELO prediction · Home avg ELO ${homeAvgAll.toFixed(0)} · Away avg ELO ${awayAvgAll.toFixed(0)}</div>
      </div>
      <div class="sc-table-wrap">
        <table class="sc">
          <thead><tr><th class="sc-corner"><span class="sc-corner-lbl">Home \\ Away</span></th>${awayHeaders}</tr></thead>
          <tbody>${bodyRows}<tr><td class="sc-sum-hdr">Rubbers won</td>${sumCells}</tr></tbody>
        </table>
      </div>
      <div class="result-banner">
        <div class="result-scoreline">
          <span class="result-home">${esc(homeTeam)}</span>
          <span class="result-score-num result-home">${homeRubbers}</span>
          <span class="result-divider">|</span>
          <span class="result-score-num result-away">${awayRubbers}</span>
          <span class="result-away">${esc(awayTeam)}</span>
        </div>
        <div class="result-verdict" style="color:${verdictColor}">${verdictText}</div>
        <div class="result-detail">Home avg ELO ${homeAvgAll.toFixed(0)} vs Away avg ELO ${awayAvgAll.toFixed(0)} &nbsp;·&nbsp; ${homeRubbers + awayRubbers} rubbers predicted</div>
      </div>
    </div>`;

  document.getElementById('scorecardOutput').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

init();
</script>
</body>
</html>
