<script>
// ── State ─────────────────────────────────────────────────────────────────
let allTeams = [];
let seasonCount = 2;
let minAppearances = 3;
let divFilter = 0; // 0 = all
let currentLeague = new URLSearchParams(window.location.search).get('league') || 'mens';

// ── League Management ────────────────────────────────────────────────────────
function setLeague(league) {
  if (currentLeague === league) return;
  currentLeague = league;
  
  // Update UI
  document.body.classList.toggle('mixed', league === 'mixed');
  document.getElementById('btnMens').classList.toggle('active', league === 'mens');
  document.getElementById('btnMixed').classList.toggle('active', league === 'mixed');
  document.getElementById('mainTitle').innerHTML = `York ${league === 'mixed' ? 'Mixed' : 'Men\'s'} Tennis — <span>Clubs</span>`;
  
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('league', league);
  window.history.pushState({}, '', url);

  init();
}

// ── Colour helpers ─────────────────────────────────────────────────────────
function ratingColor(r) {
  if (r >= 2000) return '#f5a623';
  if (r >= 1700) return '#6d5acd';
  if (r >= 1400) return '#3b82f6';
  if (r >= 1100) return '#10b981';
  return '#64748b';
}

function divColor(d) {
  const cols = ['','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#ec4899','#ec4899'];
  return cols[d] || '#64748b';
}

function wrClass(wr) {
  if (wr == null) return '';
  if (wr >= 60) return 'wr-good';
  if (wr >= 40) return 'wr-ok';
  return 'wr-bad';
}

// Rating bar width: map 900–2000 → 10–100%
function ratingBarWidth(r) {
  return Math.min(100, Math.max(10, ((r - 900) / (2000 - 900)) * 90 + 10));
}

// ── Fetch ──────────────────────────────────────────────────────────────────
async function load() {
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="spinner"></div> Loading team data…</div>';

  try {
    const res = await fetch(`/api/team-ratings?seasons=${seasonCount}&minAppearances=${minAppearances}&league=${currentLeague}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allTeams = data.teams || [];
    const seasonLabel = data.includedSeasons.length === 1
      ? `${data.includedSeasons[0]} season`
      : `${data.includedSeasons[0]}–${data.includedSeasons[data.includedSeasons.length - 1]} seasons`;
    document.getElementById('subtitle').textContent =
      `Team strength ratings · ${seasonLabel} · min ${data.minAppearances} games per player`;
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="empty"><h3>Failed to load</h3><p>${e.message}</p></div>`;
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const teams = divFilter
    ? allTeams.filter(t => t.division === divFilter)
    : allTeams;

  document.getElementById('countBadge').textContent =
    `${teams.length} team${teams.length !== 1 ? 's' : ''}`;

  if (teams.length === 0) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <h3>No teams found</h3>
        <p>Try extending the lookback window or lowering the minimum games filter.</p>
      </div>`;
    return;
  }

  // Group by division
  const byDiv = {};
  for (const t of teams) {
    const d = t.division || 0;
    if (!byDiv[d]) byDiv[d] = [];
    byDiv[d].push(t);
  }

  const html = Object.entries(byDiv)
    .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
    .map(([div, divTeams]) => renderDivSection(parseInt(div), divTeams))
    .join('');

  document.getElementById('main').innerHTML = html;

  // Wire expand buttons
  document.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleExpand(btn));
  });
}

function renderDivSection(div, teams) {
  const col = divColor(div);
  const divLabel = div ? `Division ${div}` : 'Unknown Division';
  const badgeStyle = `background:${col}22;color:${col};border:1px solid ${col}44`;

  return `
    <div class="div-section">
      <div class="div-heading">
        <h2>${divLabel}</h2>
        <span class="div-badge" style="${badgeStyle}">Div ${div || '?'}</span>
        <span class="div-count">${teams.length} teams</span>
      </div>
      <div class="teams-grid">
        ${teams.map((t, i) => renderTeamCard(t, i + 1)).join('')}
      </div>
    </div>`;
}

function renderTeamCard(team, rank) {
  const col = ratingColor(team.avgRating);
  const topCol = ratingColor(team.topRating);
  const dCol = divColor(team.division);
  const barW = ratingBarWidth(team.avgRating);
  const wrCls = wrClass(team.winRate);
  const divBadge = team.division
    ? `<span class="div-badge" style="background:${dCol}22;color:${dCol};border:1px solid ${dCol}44">Div ${team.division}</span>` : '';

  // Show top 4 players initially, rest hidden
  const PREVIEW = 4;
  const preview = team.players.slice(0, PREVIEW);
  const rest = team.players.slice(PREVIEW);

  return `
    <div class="team-card">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-team-name">${team.name}</div>
          <div class="card-meta">
            ${divBadge}
            <span class="card-rubbers">${team.totalRubbers} rubbers</span>
          </div>
        </div>
        <div class="card-rating-block">
          <div class="card-avg-label">Avg Rating</div>
          <div class="card-avg-val" style="color:${col}">${team.avgRating}</div>
          <div class="card-top-label">Top player</div>
          <div class="card-top-val" style="color:${topCol}">${team.topRating}</div>
        </div>
      </div>

      <div class="avg-bar-wrap">
        <div class="avg-bar-track">
          <div class="avg-bar-fill" style="width:${barW}%;background:${col}"></div>
        </div>
      </div>

      <div class="card-stats">
        <div class="mini-stat">
          <div class="mini-stat-label">Win Rate</div>
          <div class="mini-stat-val ${wrCls}">${team.winRate != null ? team.winRate + '%' : '—'}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">Squad Size</div>
          <div class="mini-stat-val">${team.playerCount}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">Rank in Div</div>
          <div class="mini-stat-val">#${rank}</div>
        </div>
      </div>

      <div class="player-list">
        ${preview.map((p, i) => renderPlayerRow(p, i + 1)).join('')}
        ${rest.length > 0 ? `
          <div class="player-list-extra" style="display:none">
            ${rest.map((p, i) => renderPlayerRow(p, PREVIEW + i + 1)).join('')}
          </div>
          <button class="expand-btn">
            <span class="expand-arrow">▼</span>
            Show ${rest.length} more player${rest.length !== 1 ? 's' : ''}
          </button>
        ` : ''}
      </div>
    </div>`;
}

// ── Ringer store: keyed by player name, populated during render ────────────
const ringerStore = {};

function renderPlayerRow(player, rank) {
  const col = ratingColor(player.rating);
  const wrCls = wrClass(player.winRate);
  const wrLabel = player.winRate != null ? player.winRate + '%' : '—';

  let ringerBadge = '';
  if (player.ringerInfo) {
    const key = player.name;
    ringerStore[key] = player.ringerInfo;
    const cls = player.ringerInfo.isCheating ? 'cheating' : 'ringer';
    const label = player.ringerInfo.isCheating ? 'CHEAT!' : 'RINGER';
    ringerBadge = `<button class="ringer-badge ${cls}" data-player="${player.name.replace(/"/g, '&quot;')}">${label}</button>`;
  }

  return `
    <div class="player-row">
      <span class="player-rank">${rank}</span>
      <a class="player-name-link" href="/?player=${encodeURIComponent(player.name)}&league=${currentLeague}">${player.name}</a>
      ${ringerBadge}
      <span class="player-appearances">${player.appearances}g</span>
      <span class="player-wr ${wrCls}">${wrLabel}</span>
      <span class="player-rating-pill" style="background:${col}22;color:${col};border:1px solid ${col}44">${player.rating}</span>
    </div>`;
}

// ── Ringer modal ───────────────────────────────────────────────────────────
function showRingerModal(playerName, currentTeam, currentDivision) {
  const ri = ringerStore[playerName];
  if (!ri) return;

  const cheating = ri.isCheating;

  // Verdict line
  let verdict;
  if (cheating && ri.cheatTrigger) {
    verdict = `Rule violation: had already played ${ri.cheatTrigger.countAtTime} match${ri.cheatTrigger.countAtTime !== 1 ? 'es' : ''} for `
      + `${ri.cheatTrigger.team} (Div ${ri.cheatTrigger.division}) before appearing for this team — 3+ matches = ineligible to play down.`;
  } else if (cheating) {
    verdict = `Rule violation: played for a higher team 3+ times before playing for this team.`;
  } else {
    verdict = `Playing down — fewer than 3 matches for the higher team at time of selection, so technically eligible. Still a ringer.`;
  }

  // Season breakdown rows
  const seasonRows = ri.allSeasons.map(s => {
    const higherList = s.allHigherTeams
      .map(t => `${t.team} (Div ${t.division}, ${t.matchCount} match${t.matchCount !== 1 ? 'es' : ''})`)
      .join(', ');
    const cheatNote = s.isCheating && s.cheatTrigger
      ? `<br><span style="color:#f87171;font-weight:700">Had ${s.cheatTrigger.countAtTime} matches for ${s.cheatTrigger.team} before playing down</span>`
      : '';
    return `
      <div class="modal-team-row ${s.isCheating ? 'higher' : ''}">
        <div>
          <div class="modal-team-label">${s.season} season — higher team${s.allHigherTeams.length > 1 ? 's' : ''}</div>
          <div class="modal-team-name" style="font-size:0.8rem">${higherList}</div>
        </div>
        <div class="modal-team-stats">${s.isCheating ? 'INELIGIBLE' : 'eligible'}${cheatNote}</div>
      </div>`;
  }).join('');

  document.getElementById('ringerModalBody').innerHTML = `
    <div class="modal-title">${playerName}</div>
    <div class="modal-subtitle">Flagged as ${cheating ? 'CHEAT' : 'RINGER'} for ${currentTeam} (Div ${currentDivision})</div>
    <div class="modal-verdict ${cheating ? 'cheating' : 'ringer'}">${verdict}</div>
    ${seasonRows}
    <div class="modal-team-row current" style="margin-top:8px">
      <div>
        <div class="modal-team-label">Playing down for</div>
        <div class="modal-team-name">${currentTeam}</div>
      </div>
      <div class="modal-team-stats">Div ${currentDivision}</div>
    </div>`;

  document.getElementById('ringerOverlay').classList.add('open');
}

// Wire ringer badge clicks via event delegation on the main content area
document.addEventListener('click', e => {
  const badge = e.target.closest('.ringer-badge');
  if (badge) {
    const playerName = badge.dataset.player;
    // Find which team card this badge is in
    const card = badge.closest('.team-card');
    const teamName = card ? card.querySelector('.card-team-name').textContent : '?';
    const divBadgeEl = card ? card.querySelector('.div-badge') : null;
    const divMatch = divBadgeEl ? divBadgeEl.textContent.match(/\d+/) : null;
    const divNum = divMatch ? parseInt(divMatch[0]) : '?';
    showRingerModal(playerName, teamName, divNum);
  }

  // Close modal on overlay click
  if (e.target === document.getElementById('ringerOverlay')) {
    document.getElementById('ringerOverlay').classList.remove('open');
  }
});

document.getElementById('ringerClose').addEventListener('click', () => {
  document.getElementById('ringerOverlay').classList.remove('open');
});

// ── Expand / collapse ─────────────────────────────────────────────────────
function toggleExpand(btn) {
  const extra = btn.previousElementSibling;
  const isOpen = btn.classList.contains('open');
  if (isOpen) {
    extra.style.display = 'none';
    btn.classList.remove('open');
    btn.innerHTML = `<span class="expand-arrow">▼</span> Show ${extra.children.length} more player${extra.children.length !== 1 ? 's' : ''}`;
  } else {
    extra.style.display = 'block';
    btn.classList.add('open');
    btn.innerHTML = `<span class="expand-arrow expand-btn-open" style="display:inline-block;transform:rotate(180deg)">▼</span> Hide extra players`;
  }
}

// ── Controls ───────────────────────────────────────────────────────────────
function wireBtnGroup(containerId, onSelect) {
  document.getElementById(containerId).addEventListener('click', e => {
    const btn = e.target.closest('.tog-btn');
    if (!btn) return;
    document.querySelectorAll(`#${containerId} .tog-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    onSelect(btn);
  });
}

wireBtnGroup('seasonsBtns', btn => {
  seasonCount = parseInt(btn.dataset.seasons);
  load();
});

wireBtnGroup('minAppBtns', btn => {
  minAppearances = parseInt(btn.dataset.min);
  load();
});

function buildDivFilters() {
  const el = document.getElementById('divBtns');
  el.innerHTML = '';
  const maxDiv = currentLeague === 'mixed' ? 10 : 8;
  const divs = [0];
  for (let i = 1; i <= maxDiv; i++) divs.push(i);

  divs.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'tog-btn' + (d === divFilter ? ' active' : '');
    btn.textContent = d === 0 ? 'All' : `D${d}`;
    btn.onclick = () => {
      divFilter = d;
      document.querySelectorAll('#divBtns .tog-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    el.appendChild(btn);
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  document.body.classList.toggle('mixed', currentLeague === 'mixed');
  document.getElementById('btnMens').classList.toggle('active', currentLeague === 'mens');
  document.getElementById('btnMixed').classList.toggle('active', currentLeague === 'mixed');
  document.getElementById('mainTitle').innerHTML = `York ${currentLeague === 'mixed' ? 'Mixed' : 'Men\'s'} Tennis — <span>Clubs</span>`;

  // Update nav links to preserve league
  document.querySelectorAll('nav a').forEach(a => {
    const url = new URL(a.href, window.location.origin);
    url.searchParams.set('league', currentLeague);
    a.href = url.pathname + url.search;
  });

  buildDivFilters();
  load();
}

init();
</script>
</body>
</html>
